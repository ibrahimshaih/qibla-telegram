<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Qibla Finder</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        
        .start-button {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 40px;
            background: linear-gradient(135deg, #ff0055, #ff6b9d);
            color: white;
            border: 2px solid #ff0055;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.7), 0 0 50px rgba(255, 0, 85, 0.4);
            z-index: 100;
            animation: pulse 2s infinite;
            transition: all 0.3s ease;
        }
        
        .start-button:active {
            transform: translateX(-50%) scale(0.95);
        }
        
        .start-button.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 25px rgba(255, 0, 85, 0.7), 0 0 50px rgba(255, 0, 85, 0.4);
            }
            50% {
                box-shadow: 0 0 35px rgba(255, 0, 85, 0.9), 0 0 70px rgba(255, 0, 85, 0.6);
            }
        }
        
        .compass-container {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            transition: transform 0.1s ease-out;
            margin-top: 60px;
        }
        
        .compass-disk {
            width: 100%;
            height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Compass_rose_en_04_02.svg/1024px-Compass_rose_en_04_02.svg.png') no-repeat center;
            background-size: contain;
            filter: invert(1) drop-shadow(0 0 2px #00ff88);
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .qibla-pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 130px;
            background: #ff0055;
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            z-index: 10;
            filter: drop-shadow(0 0 12px #ff0055) drop-shadow(0 0 20px #ff0055);
            display: none;
            border-radius: 3px;
        }
        
        .kaaba-icon {
            position: absolute;
            top: -46px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            z-index: 15;
            filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.8));
            display: block;
        }
        
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 11;
        }
        
        .info {
            margin-top: 40px;
            text-align: center;
            z-index: 20;
        }
        
        h1 {
            margin: 0;
            font-size: 32px;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88;
            font-weight: bold;
        }
        
        p {
            color: #aaa;
            margin: 12px 0;
            font-size: 16px;
        }
        
        .error {
            color: #ff0055;
        }
        
        .infinity-icon {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 51;
        }
        
        .infinity-icon svg {
            width: 90px;
            height: 48px;
            filter: drop-shadow(0 0 20px rgba(255, 0, 85, 0.9));
        }
        
        .calibration-info {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            max-width: 280px;
            padding: 8px 10px;
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.15), rgba(255, 107, 157, 0.15));
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 12px;
            text-align: center;
            z-index: 50;
            backdrop-filter: blur(10px);
        }
        
        .infinity-icon .arrow1 {
            animation: move-arrow1 3s ease-in-out infinite;
        }
        
        .infinity-icon .arrow2 {
            animation: move-arrow2 3s ease-in-out infinite;
        }
        
        @keyframes move-arrow1 {
            0% { opacity: 1; transform: translate(0, 0); }
            25% { opacity: 0.7; transform: translate(8px, -5px); }
            50% { opacity: 1; transform: translate(15px, 0); }
            75% { opacity: 0.7; transform: translate(8px, 5px); }
            100% { opacity: 1; transform: translate(0, 0); }
        }
        
        @keyframes move-arrow2 {
            0% { opacity: 1; transform: translate(0, 0); }
            25% { opacity: 0.7; transform: translate(-8px, 5px); }
            50% { opacity: 1; transform: translate(-15px, 0); }
            75% { opacity: 0.7; transform: translate(-8px, -5px); }
            100% { opacity: 1; transform: translate(0, 0); }
        }
        
        .calibration-info p {
            color: #ccc;
            font-size: 11px;
            line-height: 1.3;
            margin: 0;
        }
    </style>
</head>
<body>
    <button class="start-button hidden" id="startButton">🚀 START</button>
    
    <div class="compass-container">
        <div class="kaaba-icon" id="kaabaIcon">🕋</div>
        <div class="compass-disk" id="compassDisk"></div>
        <div class="qibla-pointer" id="qiblaPointer"></div>
        <div class="center-dot"></div>
    </div>
    
    <div class="info">
        <h1 id="angleText">--°</h1>
        <p id="statusText">Loading...</p>
    </div>
    
    <div class="infinity-icon">
        <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
            <!-- Знак бесконечности -->
            <path d="M 30 30 C 30 20, 40 15, 50 20 C 60 25, 60 25, 70 20 C 80 15, 90 20, 90 30 C 90 40, 80 45, 70 40 C 60 35, 60 35, 50 40 C 40 45, 30 40, 30 30 Z" 
                  fill="none" 
                  stroke="#ff0055" 
                  stroke-width="4" 
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
            
            <!-- Стрелочка 1 (левая верхняя) -->
            <g class="arrow1">
                <circle cx="35" cy="22" r="3" fill="#ff0055"/>
                <path d="M 35 22 L 32 26 M 35 22 L 38 24" 
                      stroke="#ff0055" 
                      stroke-width="3.5" 
                      stroke-linecap="round"
                      fill="none"/>
            </g>
            
            <!-- Стрелочка 2 (правая нижняя) -->
            <g class="arrow2">
                <circle cx="85" cy="38" r="3" fill="#ff0055"/>
                <path d="M 85 38 L 88 34 M 85 38 L 82 36" 
                      stroke="#ff0055" 
                      stroke-width="3.5" 
                      stroke-linecap="round"
                      fill="none"/>
            </g>
        </svg>
    </div>
    
    <div class="calibration-info">
        <p id="calibrationText">Calibration tip loading...</p>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Переводы
        const translations = {
            ru: {
                start: "🚀 СТАРТ",
                qibla: "Кибла",
                loading: "Загрузка...",
                requestingGeo: "Запрос геолокации...",
                invalidCoords: "Ошибка: Неверные координаты",
                geoError: "Не удалось получить геолокацию",
                geoNotSupported: "Геолокация не поддерживается",
                pressStart: "Нажмите кнопку СТАРТ",
                launchingCompass: "Запуск компаса...",
                allowAccess: "⛔ Разрешите доступ к датчикам!",
                accessError: "⛔ Ошибка доступа",
                rotatePhone: "🧭 Вращайте телефон",
                compassNotSupported: "⛔ Компас не поддерживается",
                calibrationTip: "Вращайте телефон пока компас не совпадёт с реальным направлением. Для калибровки нарисуйте восьмёрку в воздухе."
            },
            en: {
                start: "🚀 START",
                qibla: "Qibla",
                loading: "Loading...",
                requestingGeo: "Requesting geolocation...",
                invalidCoords: "Error: Invalid coordinates",
                geoError: "Failed to get geolocation",
                geoNotSupported: "Geolocation not supported",
                pressStart: "Press START button",
                launchingCompass: "Launching compass...",
                allowAccess: "⛔ Please allow sensor access!",
                accessError: "⛔ Access error",
                rotatePhone: "🧭 Rotate your phone",
                compassNotSupported: "⛔ Compass not supported",
                calibrationTip: "If compass is inaccurate, calibrate it by moving your phone in a figure-8 motion or open your device's native compass app."
            },
            ar: {
                start: "🚀 ابدأ",
                qibla: "القبلة",
                loading: "جاري التحميل...",
                requestingGeo: "طلب الموقع...",
                invalidCoords: "خطأ: إحداثيات غير صحيحة",
                geoError: "فشل الحصول على الموقع",
                geoNotSupported: "الموقع غير مدعوم",
                pressStart: "اضغط على زر ابدأ",
                launchingCompass: "بدء البوصلة...",
                allowAccess: "⛔ يرجى السماح بالوصول إلى المستشعرات!",
                accessError: "⛔ خطأ في الوصول",
                rotatePhone: "🧭 قم بتدوير الهاتف",
                compassNotSupported: "⛔ البوصلة غير مدعومة",
                calibrationTip: "إذا كانت البوصلة غير دقيقة، قم بمعايرتها عن طريق تحريك هاتفك على شكل رقم 8 أو افتح تطبيق البوصلة الأصلي على جهازك."
            },
            tr: {
                start: "🚀 BAŞLAT",
                qibla: "Kıble",
                loading: "Yükleniyor...",
                requestingGeo: "Konum isteniyor...",
                invalidCoords: "Hata: Geçersiz koordinatlar",
                geoError: "Konum alınamadı",
                geoNotSupported: "Konum desteklenmiyor",
                pressStart: "BAŞLAT butonuna basın",
                launchingCompass: "Pusula başlatılıyor...",
                allowAccess: "⛔ Lütfen sensör erişimine izin verin!",
                accessError: "⛔ Erişim hatası",
                rotatePhone: "🧭 Telefonunuzu döndürün",
                compassNotSupported: "⛔ Pusula desteklenmiyor",
                calibrationTip: "Pusula yanlış gösteriyorsa, kalibre edin: telefonunuzu havada 8 şeklinde hareket ettirin veya cihazınızın varsayılan pusula uygulamasını açın."
            },
            uz: {
                start: "🚀 BOSHLASH",
                qibla: "Qibla",
                loading: "Yuklanmoqda...",
                requestingGeo: "Joylashuv so'ralmoqda...",
                invalidCoords: "Xato: Noto'g'ri koordinatalar",
                geoError: "Joylashuvni olishda xatolik",
                geoNotSupported: "Joylashuv qo'llab-quvvatlanmaydi",
                pressStart: "BOSHLASH tugmasini bosing",
                launchingCompass: "Kompas ishga tushirilmoqda...",
                allowAccess: "⛔ Iltimos, sensorlarga ruxsat bering!",
                accessError: "⛔ Ruxsat xatosi",
                rotatePhone: "🧭 Telefoningizni aylantiring",
                compassNotSupported: "⛔ Kompas qo'llab-quvvatlanmaydi",
                calibrationTip: "Agar kompas noto'g'ri ko'rsatayotgan bo'lsa, kalibratsiya qiling: telefoningizni havoda 8 raqami shaklida harakatlantiring yoki qurilmangizning asosiy kompas ilovasini oching."
            }
        };
        
        // Определение языка
        let userLang = 'en';
        try {
            const tgUser = tg.initDataUnsafe?.user;
            if (tgUser && tgUser.language_code) {
                const langCode = tgUser.language_code.toLowerCase();
                // Проверяем первые 2 символа для совместимости
                const shortCode = langCode.substring(0, 2);
                
                if (translations[langCode]) {
                    userLang = langCode;
                } else if (translations[shortCode]) {
                    userLang = shortCode;
                }
            }
        } catch (e) {
            console.log('Could not get Telegram user language');
        }
        
        // Если язык не поддерживается, используем английский
        if (!translations[userLang]) {
            userLang = 'en';
        }
        
        console.log('Detected language:', userLang); // Для отладки
        
        const t = translations[userLang];
        
        const KAABA = { lat: 21.422487, lng: 39.826206 };
        let qiblaAngle = 0;
        
        const disk = document.getElementById('compassDisk');
        const pointer = document.getElementById('qiblaPointer');
        const kaabaIcon = document.getElementById('kaabaIcon');
        const angleText = document.getElementById('angleText');
        const statusText = document.getElementById('statusText');
        const startButton = document.getElementById('startButton');
        const calibrationText = document.getElementById('calibrationText');

        // Устанавливаем переводы
        startButton.textContent = '🚀 START';
        statusText.textContent = t.loading;
        calibrationText.textContent = t.calibrationTip;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const latParam = urlParams.get('lat');
            const lonParam = urlParams.get('lon');
            
            if (latParam && lonParam) {
                const lat = parseFloat(latParam);
                const lon = parseFloat(lonParam);
                
                if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
                    statusText.innerText = t.invalidCoords;
                    statusText.classList.add('error');
                } else {
                    initQibla(lat, lon);
                }
            } else {
                requestGeolocation();
            }
        };

        function requestGeolocation() {
            statusText.innerText = t.requestingGeo;
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        initQibla(lat, lon);
                    },
                    function(error) {
                        statusText.innerText = t.geoError;
                        statusText.classList.add('error');
                        console.error("Geolocation:", error);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                statusText.innerText = t.geoNotSupported;
                statusText.classList.add('error');
            }
        }

        function initQibla(lat, lng) {
            qiblaAngle = calculateQibla(lat, lng);
            angleText.innerText = `${t.qibla}: ${Math.round(qiblaAngle)}°`;
            statusText.innerText = t.pressStart;
            statusText.classList.remove('error');
            pointer.style.display = 'block';
            kaabaIcon.style.display = 'block';
            pointer.style.transform = `translate(-50%, -100%) rotate(${qiblaAngle}deg)`;
            
            startButton.classList.remove('hidden');
            
            startButton.onclick = function() {
                startButton.classList.add('hidden');
                requestPermission();
            };
        }

        function calculateQibla(lat, lng) {
            const PI = Math.PI;
            const latk = KAABA.lat * PI / 180.0;
            const longk = KAABA.lng * PI / 180.0;
            const phi = lat * PI / 180.0;
            const lambda = lng * PI / 180.0;
            const y = Math.sin(longk - lambda);
            const x = Math.cos(phi) * Math.tan(latk) - Math.sin(phi) * Math.cos(longk - lambda);
            return (Math.atan2(y, x) * 180.0 / PI + 360) % 360;
        }

        function requestPermission() {
            statusText.innerText = t.launchingCompass;
            
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            startCompass();
                        } else {
                            statusText.innerText = t.allowAccess;
                            statusText.classList.add('error');
                            startButton.classList.remove('hidden');
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        statusText.innerText = t.accessError;
                        statusText.classList.add('error');
                        startButton.classList.remove('hidden');
                    });
            } else {
                startCompass();
            }
        }

        function startCompass() {
            statusText.innerText = t.rotatePhone;
            statusText.classList.remove('error');
            
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation);
            } else if ('ondeviceorientation' in window) {
                window.addEventListener('deviceorientation', handleOrientation);
            } else {
                statusText.innerText = t.compassNotSupported;
                statusText.classList.add('error');
            }
        }

        function handleOrientation(event) {
            let alpha = event.alpha;
            
            if (event.webkitCompassHeading) {
                alpha = event.webkitCompassHeading;
            } else if (alpha !== null) {
                alpha = 360 - alpha;
            }
            
            if (alpha == null) return;
            
            disk.style.transform = `rotate(${-alpha}deg)`;
            pointer.style.transform = `translate(-50%, -100%) rotate(${qiblaAngle - alpha}deg)`;
            
            // Обновляем отображаемый угол
            const currentQiblaDirection = (qiblaAngle - alpha + 360) % 360;
            angleText.innerText = `${t.qibla}: ${Math.round(currentQiblaDirection)}°`;
        }
    </script>
</body>
</html>
