   • GitHub Pages (ibrahimshaih/qibla-telegram) — кнопка в @Salah_Times_robot;
   • мини-апп «Для мусульман» — nikahonline.app/hub/qibla/ (там же кнопка «Назад» в хаб).
  Источник: D:\bots\musulman_hub\qibla\index.html. Переделан 22.10.2026:
  сглаживание и переход 359→0 без прокрутки, учёт поворота экрана, курс 0° на iOS,
  роза ветров без внешних картинок, геолокация Telegram, подсказка «куда повернуться»,
  вибрация при совпадении, расстояние до Каабы, переводы на кнопке «Старт».
-->

<style>
@font-face { font-family: "Rubik"; font-weight: 400 800; font-display: swap; src: url("fonts/rubik-arabic.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFC; }
@font-face { font-family: "Rubik"; font-weight: 400 800; font-display: swap; src: url("fonts/rubik-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Rubik"; font-weight: 400 800; font-display: swap; src: url("fonts/rubik-cyrillic-ext.woff2") format("woff2"); unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F; }
@font-face { font-family: "Rubik"; font-weight: 400 800; font-display: swap; src: url("fonts/rubik-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C4; }
@font-face { font-family: "Rubik"; font-weight: 400 800; font-display: swap; src: url("fonts/rubik-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2212, U+FEFF; }

:root {
  --ease: cubic-bezier(.16, 1, .3, 1);
  --safe-top: max(env(safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px));
  --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
}
:root[data-theme="dark"] {
  --ground: #121833; --ground-2: #1b2443; --surface: #232e56; --surface-2: #2b3866;
  --ink: #f3ecdf; --ink-2: #b7bdd4; --ink-3: #9aa2c2; --line: rgba(243, 236, 223, .14);
  --saffron: #f2b84b; --saffron-ink: #f2b84b; --pist: #a4d494; --on: #18203c;
}
:root[data-theme="light"] {
  --ground: #ece4d4; --ground-2: #e2d8c4; --surface: #f8f3e9; --surface-2: #e4d9c5;
  --ink: #1b2443; --ink-2: #4c5576; --ink-3: #6f7794; --line: rgba(27, 36, 67, .16);
  --saffron: #c98a12; --saffron-ink: #8a5c00; --pist: #477f3c; --on: #fffaf0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: radial-gradient(120% 70% at 50% 38%, var(--ground-2) 0%, var(--ground) 70%);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.app {
  height: 100%; max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center;
  padding: calc(var(--safe-top) + 18px) 18px calc(var(--safe-bottom) + 18px);
}

/* Шапка: угол Киблы и расстояние */
.head { text-align: center; }
.head__label { font-size: 14px; color: var(--ink-2); }
.head__deg { font-size: 44px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.head__deg small { font-size: 20px; font-weight: 600; color: var(--ink-3); }
.head__meta { margin-top: 4px; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* Компас */
.compass { position: relative; width: min(84vw, 340px); aspect-ratio: 1; margin: auto 0; }
.compass__phone {
  /* Неподвижная метка «куда смотрит телефон» */
  position: absolute; left: 50%; top: -14px; width: 0; height: 0; transform: translateX(-50%);
  border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 16px solid var(--ink-2);
  z-index: 3; transition: border-top-color .3s;
}
.dial { position: absolute; inset: 0; will-change: transform; }
.dial svg { width: 100%; height: 100%; overflow: visible; }
.dial__face { fill: var(--surface); }
.dial__rim { fill: none; stroke: var(--line); stroke-width: 1.5; }
.dial__stitch { fill: none; stroke: var(--saffron); stroke-width: 1.6; stroke-dasharray: 4 3.5; opacity: .55; }
.dial__tick { stroke: var(--ink-3); stroke-width: 1.2; stroke-linecap: round; }
.dial__tick--major { stroke: var(--ink-2); stroke-width: 2; }
.dial__card { fill: var(--ink-2); font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.dial__card--n { fill: #e46a6c; }
.dial__qibla-line { stroke: var(--saffron); stroke-width: 2.5; stroke-dasharray: 5 4; stroke-linecap: round; }
.center { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 5px var(--surface-2); z-index: 2; }

.compass.is-aligned .compass__phone { border-top-color: var(--pist); }
.compass.is-aligned .dial__face { fill: color-mix(in srgb, var(--pist) 16%, var(--surface)); }
.compass.is-aligned .dial__qibla-line { stroke: var(--pist); }

/* Подсказка */
.hint { min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.hint__main { font-size: 20px; font-weight: 700; }
.hint__sub { font-size: 14px; color: var(--ink-2); line-height: 1.4; max-width: 320px; }
.hint__main.is-ok { color: var(--pist); }
.hint__arrow { display: inline-block; width: 22px; height: 22px; vertical-align: -4px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.start {
  min-height: 52px; padding: 0 28px; border-radius: 16px;
  background: var(--saffron); color: var(--on); font-size: 17px; font-weight: 700;
  box-shadow: 0 8px 20px -10px rgba(0, 0, 0, .6);
  transition: transform .2s var(--ease);
}
.start:active { transform: scale(.97); }
.start[hidden] { display: none; }

.calib { display: none; align-items: center; gap: 12px; margin-top: 10px; padding: 10px 14px; border-radius: 16px; background: var(--surface); font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.calib.is-on { display: flex; }
.calib svg { width: 56px; height: 30px; flex: none; fill: none; stroke: var(--saffron); stroke-width: 2.2; stroke-linecap: round; }
.calib .dot { fill: var(--saffron); stroke: none; offset-path: path("M14 15c0-7 9-9 14 0s14 7 14 0-9-9-14 0-14 7-14 0z"); animation: eight 2.4s linear infinite; }
@keyframes eight { from { offset-distance: 0%; } to { offset-distance: 100%; } }
@media (prefers-reduced-motion: reduce) { .calib .dot { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="head__label" id="t-label">Кибла</div>
    <div class="head__deg" id="deg">—<small>°</small></div>
    <div class="head__meta" id="meta"></div>
  </header>

  <div class="compass" id="compass">
    <span class="compass__phone" aria-hidden="true"></span>
    <div class="dial" id="dial">
      <svg viewBox="-170 -170 340 340" id="dial-svg" aria-hidden="true"></svg>
    </div>
    <span class="center" aria-hidden="true"></span>
  </div>

  <div class="hint" aria-live="polite">
    <div class="hint__main" id="hint-main"></div>
    <div class="hint__sub" id="hint-sub"></div>
  </div>
  <button class="start" type="button" id="start" hidden></button>
  <div class="calib" id="calib">
    <svg viewBox="0 0 56 30" aria-hidden="true"><path d="M14 15c0-7 9-9 14 0s14 7 14 0-9-9-14 0-14 7-14 0z" opacity=".5"/><circle class="dot" r="3.2"/></svg>
    <span id="calib-text"></span>
  </div>
</div>

<script>
(function () {
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp;
  var ver = function (v) { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v)); };

  var KAABA = { lat: 21.422487, lon: 39.826206 };
  var ALIGN_DEG = 4;

  var T = {
    ru: { qibla: "Кибла", from_north: "от севера по часовой", km: "{d} км до Каабы", start: "Включить компас",
      locating: "Определяю местоположение…", no_geo: "Не удалось определить место. Разрешите геолокацию и откройте компас снова.",
      turn_right: "Повернитесь вправо на {d}°", turn_left: "Повернитесь влево на {d}°", aligned: "Вы смотрите на Киблу",
      sub_turn: "Держите телефон горизонтально. Кааба на шкале должна встать под верхнюю метку.",
      sub_ok: "Направление совпадает с Киблой",
      press_start: "Нажмите, чтобы включить датчики телефона", denied: "Нет доступа к датчикам. Разрешите «Движение и ориентация» в настройках браузера.",
      no_compass: "На этом устройстве нет компаса. Встаньте лицом на север и повернитесь на {d}° по часовой.",
      calib: "Компас неточен: нарисуйте телефоном в воздухе восьмёрку и отойдите от металла и магнитов.",
      by_city: "по городу {c}" },
    en: { qibla: "Qibla", from_north: "clockwise from north", km: "{d} km to the Kaaba", start: "Turn on compass",
      locating: "Finding your location…", no_geo: "Couldn't get your location. Allow geolocation and open the compass again.",
      turn_right: "Turn right by {d}°", turn_left: "Turn left by {d}°", aligned: "You are facing the Qibla",
      sub_turn: "Hold the phone flat. Bring the Kaaba on the dial under the top mark.",
      sub_ok: "Your direction matches the Qibla",
      press_start: "Tap to turn on the phone's sensors", denied: "No sensor access. Allow Motion & Orientation in your browser settings.",
      no_compass: "This device has no compass. Face north and turn {d}° clockwise.",
      calib: "The compass is inaccurate: draw a figure 8 in the air with your phone and move away from metal and magnets.",
      by_city: "for {c}" },
    ar: { qibla: "القبلة", from_north: "من الشمال باتجاه عقارب الساعة", km: "{d} كم إلى الكعبة", start: "تشغيل البوصلة",
      locating: "جارٍ تحديد موقعك…", no_geo: "تعذر تحديد الموقع. اسمح بالوصول إلى الموقع وافتح البوصلة مجددًا.",
      turn_right: "استدر يمينًا {d}°", turn_left: "استدر يسارًا {d}°", aligned: "أنت متجه إلى القبلة",
      sub_turn: "أمسك الهاتف أفقيًا وأوصل الكعبة في القرص إلى العلامة العلوية.",
      sub_ok: "اتجاهك يطابق القبلة",
      press_start: "اضغط لتشغيل مستشعرات الهاتف", denied: "لا يوجد إذن بالمستشعرات. اسمح بالحركة والاتجاه في إعدادات المتصفح.",
      no_compass: "لا توجد بوصلة في هذا الجهاز. اتجه إلى الشمال ثم استدر {d}° مع عقارب الساعة.",
      calib: "البوصلة غير دقيقة: ارسم بالهاتف رقم 8 في الهواء وابتعد عن المعادن والمغناطيس.",
      by_city: "حسب مدينة {c}" },
    tr: { qibla: "Kıble", from_north: "kuzeyden saat yönünde", km: "Kâbe'ye {d} km", start: "Pusulayı aç",
      locating: "Konum bulunuyor…", no_geo: "Konum alınamadı. Konum iznini verip pusulayı yeniden açın.",
      turn_right: "Sağa {d}° dönün", turn_left: "Sola {d}° dönün", aligned: "Kıbleye dönüksünüz",
      sub_turn: "Telefonu yatay tutun. Kadrandaki Kâbe'yi üstteki işaretin altına getirin.",
      sub_ok: "Yönünüz kıbleyle aynı",
      press_start: "Telefon sensörlerini açmak için dokunun", denied: "Sensör izni yok. Tarayıcı ayarlarında Hareket ve Yön'e izin verin.",
      no_compass: "Bu cihazda pusula yok. Kuzeye dönüp saat yönünde {d}° dönün.",
      calib: "Pusula hatalı: telefonla havada 8 çizin, metal ve mıknatıslardan uzaklaşın.",
      by_city: "{c} için" },
    uz: { qibla: "Qibla", from_north: "shimoldan soat yo'nalishida", km: "Ka'bagacha {d} km", start: "Kompasni yoqish",
      locating: "Joylashuv aniqlanmoqda…", no_geo: "Joylashuvni aniqlab bo'lmadi. Ruxsat bering va kompasni qayta oching.",
      turn_right: "O'ngga {d}° buriling", turn_left: "Chapga {d}° buriling", aligned: "Siz Qiblaga qarab turibsiz",
      sub_turn: "Telefonni gorizontal ushlang. Shkaladagi Ka'bani yuqoridagi belgining ostiga keltiring.",
      sub_ok: "Yo'nalishingiz Qiblaga mos",
      press_start: "Telefon sensorlarini yoqish uchun bosing", denied: "Sensorlarga ruxsat yo'q. Brauzer sozlamalarida ruxsat bering.",
      no_compass: "Bu qurilmada kompas yo'q. Shimolga qarab, soat yo'nalishida {d}° buriling.",
      calib: "Kompas noaniq: telefon bilan havoda 8 raqamini chizing, metall va magnitlardan uzoqlashing.",
      by_city: "{c} bo'yicha" },
  };

  /* Язык: ?lang=, затем язык Telegram, затем браузер */
  var params = new URLSearchParams(location.search);
  var user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  var hubLang = null;
  try { hubLang = JSON.parse(localStorage.getItem("mh:lang") || "null"); } catch (e) { /* не в хабе */ }
  var code = (params.get("lang") || hubLang || (user && user.language_code) || navigator.language || "ru").slice(0, 2).toLowerCase();
  if (["uk", "be", "kk", "ky", "tg", "tt", "ba"].indexOf(code) >= 0) code = "ru";
  var L = T[code] ? code : "en";
  var tr = function (k, v) { var s = T[L][k]; if (v) for (var x in v) s = s.split("{" + x + "}").join(v[x]); return s; };
  document.documentElement.lang = L;
  if (L === "ar") document.documentElement.dir = "rtl";

  var $ = function (id) { return document.getElementById(id); };
  var dial = $("dial"), compass = $("compass"), startBtn = $("start");
  $("t-label").textContent = tr("qibla");
  startBtn.textContent = tr("start");
  $("calib-text").textContent = tr("calib");
  document.title = tr("qibla");

  /* ---------- Тема и Telegram ---------- */
  // По умолчанию тёмная; в хабе — та, что человек выбрал переключателем (mh:theme)
  function applyTheme() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem("mh:theme") || "null"); } catch (e) { /* не в хабе */ }
    var scheme = saved === "light" ? "light" : "dark";
    document.documentElement.dataset.theme = scheme;
    if (ver("6.9")) {
      var bg = getComputedStyle(document.documentElement).getPropertyValue("--ground").trim();
      try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) { /* старый клиент */ }
    }
  }
  if (tg) {
    try {
      tg.ready(); tg.expand();
      if (ver("7.7")) tg.disableVerticalSwipes();
      // Внутри хаба — кнопка «Назад» возвращает в «Для мусульман»
      if (location.pathname.indexOf("/hub/qibla") >= 0 && tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(function () {
          if (history.length > 1 && document.referrer.indexOf("/hub/") >= 0) history.back(); else location.replace("../");
        });
      }
    } catch (e) { /* вне Telegram */ }
  }
  applyTheme();

  /* ---------- Шкала ---------- */
  var KAABA_SVG = '<g class="kaaba"><rect x="-11" y="-11" width="22" height="22" rx="2.5" fill="#161616" stroke="#f5c542" stroke-width="1.2"/>' +
    '<rect x="-11" y="-5.5" width="22" height="3.6" fill="#f5c542"/><rect x="-3" y="2" width="6" height="9" rx="1" fill="#f5c542" opacity=".85"/></g>';
  function buildDial(qibla) {
    var h = '<circle class="dial__face" r="150"/><circle class="dial__rim" r="150"/><circle class="dial__stitch" r="142"/>';
    for (var a = 0; a < 360; a += 5) {
      var major = a % 30 === 0, r1 = 136, r2 = major ? 120 : 128;
      var rad = (a - 90) * Math.PI / 180;
      h += '<line class="dial__tick' + (major ? " dial__tick--major" : "") + '" x1="' + (Math.cos(rad) * r1).toFixed(1) + '" y1="' + (Math.sin(rad) * r1).toFixed(1) +
        '" x2="' + (Math.cos(rad) * r2).toFixed(1) + '" y2="' + (Math.sin(rad) * r2).toFixed(1) + '"/>';
    }
    var cards = [["N", 0], ["E", 90], ["S", 180], ["W", 270]];
    cards.forEach(function (c) {
      var rad = (c[1] - 90) * Math.PI / 180;
      h += '<text class="dial__card' + (c[0] === "N" ? " dial__card--n" : "") + '" x="' + (Math.cos(rad) * 104).toFixed(1) + '" y="' + (Math.sin(rad) * 104).toFixed(1) + '">' + c[0] + "</text>";
    });
    if (qibla != null) {
      var qr = (qibla - 90) * Math.PI / 180;
      h += '<line class="dial__qibla-line" x1="0" y1="0" x2="' + (Math.cos(qr) * 112).toFixed(1) + '" y2="' + (Math.sin(qr) * 112).toFixed(1) + '"/>';
      h += '<g transform="translate(' + (Math.cos(qr) * 156).toFixed(1) + " " + (Math.sin(qr) * 156).toFixed(1) + ")\">" + KAABA_SVG + "</g>";
    }
    $("dial-svg").innerHTML = h;
  }
  buildDial(null);

  /* ---------- Расчёт ---------- */
  function qiblaBearing(lat, lon) {
    var p1 = lat * Math.PI / 180, p2 = KAABA.lat * Math.PI / 180, dl = (KAABA.lon - lon) * Math.PI / 180;
    var y = Math.sin(dl), x = Math.cos(p1) * Math.tan(p2) - Math.sin(p1) * Math.cos(dl);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  function distanceKm(lat, lon) {
    var R = 6371, p1 = lat * Math.PI / 180, p2 = KAABA.lat * Math.PI / 180;
    var dp = p2 - p1, dl = (KAABA.lon - lon) * Math.PI / 180;
    var a = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  var qibla = null;
  function setLocation(lat, lon, cityName) {
    qibla = qiblaBearing(lat, lon);
    $("deg").innerHTML = Math.round(qibla) + "<small>°</small>";
    var km = Math.round(distanceKm(lat, lon)).toLocaleString(L === "ar" ? "ar-u-nu-latn" : L);
    $("meta").textContent = tr("from_north") + " · " + tr("km", { d: km }) + (cityName ? " · " + tr("by_city", { c: cityName }) : "");
    buildDial(qibla);
    prepareSensors();
  }

  /* ---------- Местоположение: ?lat&lon → Telegram → браузер → город из хаба ---------- */
  function hubCity() {
    try { var c = JSON.parse(localStorage.getItem("mh:prayer") || "null"); return c && c.city; } catch (e) { return null; }
  }
  function locate() {
    var lat = parseFloat(params.get("lat")), lon = parseFloat(params.get("lon") || params.get("lng"));
    if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return setLocation(lat, lon);
    $("hint-main").textContent = tr("locating");
    var fallback = function () {
      var c = hubCity();
      if (c && isFinite(c.lat)) return setLocation(c.lat, c.lon, c.name);
      $("hint-main").textContent = "";
      $("hint-sub").textContent = tr("no_geo");
    };
    var viaBrowser = function () {
      if (!navigator.geolocation) return fallback();
      navigator.geolocation.getCurrentPosition(function (p) { setLocation(p.coords.latitude, p.coords.longitude); },
        fallback, { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
    };
    if (ver("8.0") && tg.LocationManager) {
      var lm = tg.LocationManager;
      var ask = function () {
        if (!lm.isLocationAvailable) return viaBrowser();
        lm.getLocation(function (loc) { if (loc) setLocation(loc.latitude, loc.longitude); else viaBrowser(); });
      };
      if (lm.isInited) ask(); else lm.init(ask);
    } else viaBrowser();
  }

  /* ---------- Датчики ---------- */
  var needsPermission = typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function";
  var started = false;
  function prepareSensors() {
    if (started) return;
    if (needsPermission) {
      // iOS: доступ к датчикам — только по нажатию
      startBtn.hidden = false;
      $("hint-main").textContent = "";
      $("hint-sub").textContent = tr("press_start");
    } else startSensors();
  }
  startBtn.addEventListener("click", function () {
    DeviceOrientationEvent.requestPermission().then(function (res) {
      if (res === "granted") { startBtn.hidden = true; startSensors(); }
      else $("hint-sub").textContent = tr("denied");
    }).catch(function () { $("hint-sub").textContent = tr("denied"); });
  });

  var gotHeading = false;
  function startSensors() {
    started = true;
    $("hint-main").textContent = "";
    $("hint-sub").textContent = tr("sub_turn");
    if ("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute", onOrient);
    else window.addEventListener("deviceorientation", onOrient);
    // Через 2,5 с без данных — компаса нет (компьютер, старый телефон)
    setTimeout(function () {
      if (!gotHeading && qibla != null) {
        $("hint-main").textContent = "";
        $("hint-sub").textContent = tr("no_compass", { d: Math.round(qibla) });
      }
    }, 2500);
    requestAnimationFrame(frame);
  }

  function screenAngle() {
    var o = screen.orientation && typeof screen.orientation.angle === "number" ? screen.orientation.angle : (window.orientation || 0);
    return o || 0;
  }

  /* Сглаживание через вектор (sin, cos): нет скачка 359° → 0° */
  var sx = 0, sy = 0, hasSmooth = false;
  function onOrient(e) {
    var heading = null, accurate = true;
    if (e.webkitCompassHeading != null && !isNaN(e.webkitCompassHeading)) {
      heading = e.webkitCompassHeading;                       // iOS: уже от севера
      if (e.webkitCompassAccuracy != null && (e.webkitCompassAccuracy < 0 || e.webkitCompassAccuracy > 25)) accurate = false;
    } else if (e.alpha != null) {
      if (e.type === "deviceorientation" && e.absolute !== true) accurate = false;   // не привязан к северу
      heading = (360 - e.alpha) % 360;
    }
    if (heading == null) return;
    heading = (heading + screenAngle()) % 360;
    gotHeading = true;
    $("calib").classList.toggle("is-on", !accurate);
    var r = heading * Math.PI / 180, k = hasSmooth ? 0.18 : 1;
    sx += (Math.sin(r) - sx) * k;
    sy += (Math.cos(r) - sy) * k;
    hasSmooth = true;
  }

  var shown = 0, wasAligned = false;
  function frame() {
    requestAnimationFrame(frame);
    if (!hasSmooth || qibla == null) return;
    var heading = (Math.atan2(sx, sy) * 180 / Math.PI + 360) % 360;
    // Поворот шкалы накапливается без обрыва: кратчайший путь до нового угла
    var target = -heading;
    var delta = ((target - shown) % 360 + 540) % 360 - 180;
    shown += delta;
    dial.style.transform = "rotate(" + shown.toFixed(2) + "deg)";

    var diff = ((qibla - heading) % 360 + 540) % 360 - 180;   // >0 — Кибла правее
    var aligned = Math.abs(diff) <= ALIGN_DEG;
    compass.classList.toggle("is-aligned", aligned);
    var main = $("hint-main");
    if (aligned) {
      main.textContent = tr("aligned");
      main.className = "hint__main is-ok";
      $("hint-sub").textContent = tr("sub_ok");
    } else {
      var d = Math.round(Math.abs(diff));
      var arrow = diff > 0 ? '<svg class="hint__arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' : '<svg class="hint__arrow" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
      main.innerHTML = (diff > 0 ? tr("turn_right", { d: d }) : tr("turn_left", { d: d })) + " " + arrow;
      main.className = "hint__main";
      $("hint-sub").textContent = tr("sub_turn");
    }
    if (aligned && !wasAligned) {
      try {
        if (ver("6.1")) tg.HapticFeedback.notificationOccurred("success");
        else if (navigator.vibrate) navigator.vibrate(40);
      } catch (e) { /* без вибрации */ }
    }
    wasAligned = aligned;
  }

  locate();
})();
</script>
</body>
</html>
